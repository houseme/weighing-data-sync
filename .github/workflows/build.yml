name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Artifact tag/name to use for manual builds, for example v0.1.0"
        required: false
        default: "manual"
      publish_release:
        description: "Upload manual build artifacts to a GitHub Release using release_tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: sync-daemon
  PACKAGE_NAME: weighing-data-sync
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate manual release inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" == "manual" ]]; then
            echo "release_tag must be set to a real tag name when publish_release is true" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: validate-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked || true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy all targets and all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all features
        run: cargo test --all-features

      - name: Check feature combinations
        run: cargo hack check --feature-powerset --no-dev-deps || cargo check --all-features

      - name: Analyze Cargo feature coverage
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          ruby <<'RUBY'
          require "json"

          metadata = JSON.parse(File.read("metadata.json"))
          package = metadata.fetch("packages").find { |pkg| pkg.fetch("name") == "weighing-data-sync" }
          features = package.fetch("features")
          all_features = features.keys.sort
          default_features = features.fetch("default", []).sort
          optional_features = (all_features - ["default"]).sort
          release_non_windows = (default_features + %w[compression websocket]).uniq.sort
          release_windows = (release_non_windows + %w[windows]).uniq.sort

          puts "Cargo features: #{all_features.join(", ")}"
          puts "Default features: #{default_features.join(", ")}"
          puts "Release non-Windows feature set: #{release_non_windows.join(", ")}"
          puts "Release Windows feature set: #{release_windows.join(", ")}"

          missing_non_windows = optional_features - release_non_windows - %w[windows]
          missing_windows = optional_features - release_windows
          abort "Non-Windows release feature set is missing: #{missing_non_windows.join(", ")}" unless missing_non_windows.empty?
          abort "Windows release feature set is missing: #{missing_windows.join(", ")}" unless missing_windows.empty?
          RUBY

  build:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            features: compression,websocket
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            features: compression,websocket
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            features: windows,compression,websocket
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            features: windows,compression,websocket
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            features: compression,websocket
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            features: compression,websocket

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          args=(build --locked --release --target "${{ matrix.target }}")
          if [[ -n "${{ matrix.features }}" ]]; then
            args+=(--features "${{ matrix.features }}")
          fi
          cargo "${args[@]}"

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-manual}"
          artifact="${PACKAGE_NAME}-${tag}-${{ matrix.name }}"
          mkdir -p "dist/${artifact}"

          exe="${BIN_NAME}"
          case "${{ matrix.os }}" in
            windows-*) exe="${BIN_NAME}.exe" ;;
          esac

          cp "target/${{ matrix.target }}/release/${exe}" "dist/${artifact}/"
          cp README.md LICENSE-AGPL "dist/${artifact}/"
          cp config/windows-production.example.toml "dist/${artifact}/production.example.toml"
          cp scripts/install-windows.ps1 scripts/uninstall-windows.ps1 "dist/${artifact}/" 2>/dev/null || true
          cp docs/deployment-windows.md "dist/${artifact}/" 2>/dev/null || true

      - name: Archive artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-manual}"
          artifact="${PACKAGE_NAME}-${tag}-${{ matrix.name }}"
          mkdir -p artifacts

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "../artifacts/${artifact}.zip" "${artifact}" >/dev/null)
          else
            tar -C dist -czf "artifacts/${artifact}.tar.gz" "${artifact}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
